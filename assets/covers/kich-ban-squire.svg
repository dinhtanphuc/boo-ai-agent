<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1f4a"/><stop offset=".55" stop-color="#c2502f"/><stop offset="1" stop-color="#f2a541"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7c1"/><stop offset="1" stop-color="#dcc28c"/>
    </linearGradient>
    <g id="knight">
      <rect x="-30" y="22" width="60" height="58" rx="14" fill="#8d96a3" stroke="#2b1d14" stroke-width="5"/>
      <rect x="-30" y="44" width="60" height="9" fill="#b33a2e" stroke="#2b1d14" stroke-width="3"/>
      <circle cx="0" cy="0" r="34" fill="#fff" stroke="#2b1d14" stroke-width="5"/>
      <path d="M-36 2 A36 36 0 0 1 36 2 L36 -2 L-36 -2 Z" fill="#9aa3ae" stroke="#2b1d14" stroke-width="5"/>
      <path d="M0 -36 L0 -52" stroke="#2b1d14" stroke-width="5"/>
      <path d="M0 -52 Q16 -60 26 -48" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-11" cy="12" r="4.5" fill="#2b1d14"/><circle cx="11" cy="12" r="4.5" fill="#2b1d14"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="520" cy="250" r="90" fill="#ffd27a" opacity=".35"/>
  <path d="M0 290 Q120 250 250 280 T520 270 T640 260 V360 H0 Z" fill="#2a1622"/>
  <path d="M0 315 Q160 290 330 310 T640 300 V360 H0 Z" fill="#170c13"/>
  <!-- castle -->
  <g fill="#1d0f18">
    <rect x="430" y="200" width="150" height="80"/>
    <rect x="420" y="170" width="34" height="110"/><rect x="556" y="170" width="34" height="110"/>
    <path d="M420 170 h8 v-10 h8 v10 h10 v-10 h8 v10 M556 170 h8 v-10 h8 v10 h10 v-10 h8 v10" stroke="#1d0f18" stroke-width="8"/>
    <path d="M490 280 v-34 a15 15 0 0 1 30 0 v34 z" fill="#f2a541" opacity=".6"/>
  </g>
  <!-- scroll -->
  <g transform="translate(250 54) rotate(4)">
    <rect x="0" y="12" width="170" height="200" fill="url(#paper)" stroke="#2b1d14" stroke-width="5"/>
    <rect x="-10" y="0" width="190" height="22" rx="11" fill="#c9a96a" stroke="#2b1d14" stroke-width="5"/>
    <rect x="-10" y="202" width="190" height="22" rx="11" fill="#c9a96a" stroke="#2b1d14" stroke-width="5"/>
    <g stroke="#6b4a2b" stroke-width="5" stroke-linecap="round">
      <path d="M22 50 h120"/><path d="M22 74 h96"/><path d="M22 98 h126"/><path d="M22 122 h80"/>
      <path d="M22 146 h112"/><path d="M22 170 h70"/>
    </g>
    <text x="85" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#7a2d1f">ACT I</text>
  </g>
  <!-- knight with quill -->
  <g transform="translate(150 175)"><use href="#knight"/></g>
  <path d="M182 210 L250 140" stroke="#2b1d14" stroke-width="5" stroke-linecap="round"/>
  <path d="M250 140 Q268 104 292 96 Q276 126 250 140 Z" fill="#fff" stroke="#2b1d14" stroke-width="4"/>
  <!-- title -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900" stroke="#120a0a" stroke-linejoin="round">
    <text x="30" y="306" font-size="58" fill="#120a0a" stroke-width="12">THE SCRIPT</text>
    <text x="30" y="344" font-size="30" fill="#120a0a" stroke-width="8">YOU ARE THE SOLDIER</text>
  </g>
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900">
    <text x="30" y="306" font-size="58" fill="#ffd23f">THE SCRIPT</text>
    <text x="30" y="344" font-size="30" fill="#fff">YOU ARE THE SOLDIER</text>
  </g>
  <g transform="translate(548 26)">
    <rect width="72" height="30" rx="15" fill="#120a0a"/>
    <text x="36" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#ffd23f">10 MIN</text>
  </g>
</svg>
