<!doctype html>
<html lang="vi">
<head>
<title>Đặt lại mật khẩu · Boo AI Agent</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f5b83d'/><text x='50' y='70' font-size='62' text-anchor='middle' font-family='Arial' font-weight='900' fill='%231c1400'>B</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/skills.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<header id="site-header"></header>
<main class="auth">
  <div class="auth-box">
    <h1>Đặt lại mật khẩu</h1>
    <p class="sub">Nhập mật khẩu mới cho tài khoản của bạn.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="password">Mật khẩu mới</label>
        <input class="input" id="password" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự" required />
      </div>
      <div class="field">
        <label for="password2">Nhập lại mật khẩu mới</label>
        <input class="input" id="password2" type="password" autocomplete="new-password" required />
      </div>
      <div class="form-msg" id="msg"></div>
      <button class="btn btn-primary btn-block" type="submit" id="submit">Lưu mật khẩu mới</button>
    </form>
  </div>
</main>
<footer id="site-footer"></footer>
<script>
(async function () {
  const { sb, renderChrome, getUser, viError } = App;
  await renderChrome();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");
  const say = (t, ok) => { msg.className = "form-msg " + (ok ? "ok" : "err"); msg.textContent = t; };
  setTimeout(async () => {
    if (!(await getUser())) say("Link đặt lại đã hết hạn hoặc không hợp lệ. Hãy gửi lại từ trang Đăng nhập.");
  }, 1500);

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    if (!sb) return say("Web chưa cấu hình Supabase.");
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("password2").value;
    if (p1.length < 8) return say("Mật khẩu cần ít nhất 8 ký tự.");
    if (p1 !== p2) return say("Hai mật khẩu không khớp.");
    btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false;
    if (error) return say(viError(error));
    say("Đã đổi mật khẩu. Đang chuyển về trang chủ…", true);
    setTimeout(() => location.replace("index.html"), 1200);
  };
})();
</script>
</body>
</html>
